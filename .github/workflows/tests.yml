name: Tests

on:
  push:
  pull_request:

jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install care and browser test dependencies
        run: |
          python -m pip install -r requirements-serve.txt
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Audit accessibility and care flow
        run: npm run test:accessibility
  cpu-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Full validation includes the expanded RGB suites and synthetic training/resume checks.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-serve.txt
            requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-test.txt
      - name: Run isolated CPU suites
        run: python -u run_tests.py --all
